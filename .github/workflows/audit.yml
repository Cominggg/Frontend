name: Security Audit

on:
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
  pull_request:
    branches: [main]
    paths:
      - package.json
      - package-lock.json

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
